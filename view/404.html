<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --ink: #121820;
    --paper: #ECE7DC;
    --amber: #D9A441;
    --line: rgba(236, 231, 220, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .scene {
    position: relative;
    width: min(680px, 92vw);
    padding: 2rem;
  }

  .path {
    position: absolute;
    top: -60px;
    left: -40px;
    width: 340px;
    height: 220px;
    z-index: 0;
    opacity: 0.9;
  }

  .path path {
    fill: none;
    stroke: var(--amber);
    stroke-width: 2;
    stroke-dasharray: 6 10;
    stroke-linecap: round;
    stroke-dashoffset: 480;
    animation: draw 2.2s ease-out forwards;
  }

  .path circle {
    fill: var(--amber);
    opacity: 0;
    animation: dot-in 0.4s ease-out forwards;
    animation-delay: 2.1s;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  @keyframes dot-in {
    to { opacity: 1; }
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .code {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(4rem, 14vw, 7.5rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--paper);
  }

  .status-line {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-top: 0.6rem;
    margin-bottom: 2rem;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: rgba(236, 231, 220, 0.55);
  }

  .status-line .amber {
    color: var(--amber);
  }

  .status-line::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    display: inline-block;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    line-height: 1.3;
    max-width: 26ch;
    margin-bottom: 0.9rem;
  }

  p {
    font-size: 0.92rem;
    line-height: 1.7;
    color: rgba(236, 231, 220, 0.7);
    max-width: 46ch;
    margin-bottom: 2.2rem;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 1.6rem;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--amber);
    color: var(--ink);
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.85rem;
    padding: 0.75rem 1.4rem;
    border-radius: 2px;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .btn:hover {
    background: #E8B65D;
    transform: translateY(-1px);
  }

  .btn:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 3px;
  }

  .secondary {
    font-size: 0.82rem;
    color: rgba(236, 231, 220, 0.5);
    text-decoration: none;
    border-bottom: 1px solid rgba(236, 231, 220, 0.25);
    padding-bottom: 1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .secondary:hover {
    color: var(--paper);
    border-color: var(--paper);
  }

  .secondary:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 3px;
  }

  footer {
    position: absolute;
    bottom: 2rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.72rem;
    color: rgba(236, 231, 220, 0.3);
    letter-spacing: 0.03em;
  }

  @media (prefers-reduced-motion: reduce) {
    .path path, .path circle {
      animation: none;
      stroke-dashoffset: 0;
      opacity: 1;
    }
  }

  @media (max-width: 480px) {
    .path { display: none; }
    .actions { flex-direction: column; align-items: flex-start; gap: 1rem; }
  }
</style>
</head>
<body>

  <div class="scene">
    <svg class="path" viewBox="0 0 340 220" aria-hidden="true">
      <path d="M 10 200 Q 90 210 130 150 T 220 90 Q 260 60 300 20" />
      <circle cx="300" cy="20" r="4" />
    </svg>

    <div class="content">
      <div class="code">404</div>
      <div class="status-line"><span class="amber">GET</span>&nbsp;— route not found</div>

      <h1>This page wandered off the map.</h1>
      <p>
        The link you followed doesn't lead anywhere on this server —
        it may have been moved, renamed, or never existed in the first place.
      </p>

      <div class="actions">
        <a href="/" class="btn">Back to home</a>
        <a href="javascript:history.back()" class="secondary">Go back</a>
      </div>
    </div>
  </div>

  <footer>error 404 · not found</footer>

</body>
</html>
